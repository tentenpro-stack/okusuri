<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171b3b"><title>お薬博士への道</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fffaf0;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 15% 10%,#465080,transparent 35%),radial-gradient(circle at 90% 80%,#3c5270,transparent 35%),linear-gradient(145deg,#151832,#24254d 55%,#172d43)}.wrap{max-width:740px;margin:auto;padding:22px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:.12em;color:#d6d9ff}.sound,.secondary{border:1px solid #ffffff55;background:#ffffff14;color:white;border-radius:99px;padding:10px 14px}.hero{text-align:center;padding:26px 8px 20px}.orb{font-size:54px;margin:auto auto 12px;width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff4c5,#eabf76 48%,#9a70a7);box-shadow:0 0 40px #ffdb9b66}.hero h1{font-size:clamp(30px,7vw,44px);margin:0;color:#ffe7b3}.sub{color:#d9ddff;font-size:14px;line-height:1.8}.panel{background:#ffffff12;border:1px solid #ffffff30;border-radius:23px;padding:22px;box-shadow:0 18px 50px #090d2740}.hidden{display:none!important}.intro{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}.mini{text-align:center;background:#ffffff0d;border-radius:14px;padding:12px 5px;font-size:12px}.mini b{display:block;font-size:24px}.primary{width:100%;border:0;border-radius:15px;padding:15px;background:linear-gradient(100deg,#ffe3a3,#f6bf79);color:#33274a;font-weight:800;font-size:16px}.note{font-size:12px;line-height:1.7;color:#cdd2f0}.progress{display:flex;justify-content:space-between;font-size:13px;color:#e1e4ff;margin-bottom:9px}.track{height:8px;background:#ffffff20;border-radius:9px;overflow:hidden;margin-bottom:20px}.fill{height:100%;background:linear-gradient(90deg,#a8ead7,#ffe09b);width:0}.tag{display:inline-block;padding:6px 11px;border-radius:99px;background:#ffe2a51c;color:#ffe1a1;font-size:12px;margin-bottom:10px}.question{font-size:21px;line-height:1.6}.choices{display:grid;gap:10px}.choice{text-align:left;border:1px solid #ffffff30;background:#ffffff0d;color:white;border-radius:14px;padding:14px;line-height:1.5}.choice:disabled{opacity:1}.correct{border-color:#9ee6c9;background:#9ee6c926}.wrong{border-color:#ffaaa6;background:#ffaaa626}.feedback{margin-top:15px;padding:14px;border-radius:15px;background:#11173588;line-height:1.7;font-size:14px}.feedback strong{color:#ffd98a}.next{margin-top:14px}.result{text-align:center}.medal{font-size:65px}.result h2{color:#ffe3a4}.score{font-size:40px;color:#b9f0df;font-weight:800}.result p{line-height:1.8;color:#e3e5ff}.secondary{width:100%;border-radius:14px;padding:13px}.footer{text-align:center;color:#aeb5db;font-size:11px;margin-top:22px}@media(min-width:600px){.choices{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="top"><div class="brand">A LITTLE JOURNEY OF MEDICINE</div><button class="sound" id="sound">♫ 音楽 ON</button></div><header class="hero"><div class="orb">⚗️</div><h1>お薬博士への道</h1><p class="sub">小さな薬の研究所から、知識をめぐる冒険へ。<br>クイズに答えて、きみもお薬博士を目指そう。</p></header>
<section class="panel" id="start"><h2 style="text-align:center;color:#ffe4aa">薬のふしぎを解き明かそう！</h2><div class="intro"><div class="mini"><b>📚</b>全10問</div><div class="mini"><b>✨</b>4択クイズ</div><div class="mini"><b>🏅</b>博士ランク</div></div><button class="primary" id="begin">冒険をはじめる</button><p class="note">音楽は右上からON／OFFできます。正解・不正解・クリア時には効果音が鳴ります。<br>※学習・娯楽用です。実際の服薬や治療の判断には使わず、医師・薬剤師などに確認してください。</p></section>
<section class="panel hidden" id="quiz"><div class="progress"><span id="count"></span><span id="points"></span></div><div class="track"><div class="fill" id="fill"></div></div><span class="tag" id="level"></span><h2 class="question" id="question"></h2><div class="choices" id="choices"></div><div class="feedback hidden" id="feedback"></div><button class="primary next hidden" id="next">次の問題へ</button></section>
<section class="panel result hidden" id="result"><div class="medal" id="medal">🏅</div><span class="tag">冒険の記録</span><h2 id="rank"></h2><div class="score" id="score"></div><p id="message"></p><button class="primary" id="again">もう一度挑戦する</button><p><button class="secondary" id="share">結果をシェアする</button></p></section><div class="footer">Made for curious learners ✦ お薬博士への道</div></div>
<script>
const qs=[
["薬のきほん","錠剤やカプセルなど、薬の形のことを何という？",["薬効","剤形","用量","効能"],1,"薬の形状や使い方による分類を「剤形」といいます。錠剤、散剤、液剤、軟膏、坐剤などがあります。"],
["薬のきほん","薬を使う前に確認したいこととして最も適切なのは？",["色だけを見る","以前もらった薬なら確認しない","薬の名前・用法用量・使用期限などを確認する","味を確かめる"],2,"薬の取り違えや誤使用を防ぐため、薬の名前、用法・用量、使用期限などを確認します。"],
["身近な薬","一般に、解熱鎮痛薬が使われる目的は？",["熱や痛みをやわらげる","細菌を必ず死滅させる","血糖値を下げる","眠気を必ず起こす"],0,"解熱鎮痛薬は発熱や痛みをやわらげる目的で使われます。原因そのものを治すとは限りません。"],
["身近な薬","抗菌薬について正しい説明はどれ？",["風邪のウイルスに必ず効く","細菌による感染症などに用いられる","痛み止めとして使う","飲み忘れたら必ず2回分飲む"],1,"抗菌薬は細菌に作用する薬です。ウイルスが原因の一般的な風邪には通常効果がありません。"],
["身近な薬","薬を飲み忘れたときの対応で適切なのは？",["次に2回分まとめて飲む","自己判断で倍量にする","薬ごとの指示を確認し、医師・薬剤師に相談する","その薬を全部捨てる"],2,"対応は薬の種類や服用間隔によって異なります。自己判断でまとめ飲みや倍量服用をせず、医師・薬剤師に確認しましょう。"],
["安全に使う","薬による副作用が疑われる症状が出たとき、適切なのは？",["必ず我慢する","自己判断で別の薬を追加する","医師・薬剤師に相談し、緊急性が高い症状なら速やかに受診する","友人の薬を使う"],2,"副作用が疑われる場合は専門家に相談します。息苦しさ、意識障害、急な強い症状などは緊急対応が必要です。"],
["安全に使う","複数の医療機関から薬が処方されているとき、大切なのは？",["それぞれに別の薬を隠す","お薬手帳などで服用薬を共有する","薬の名前を覚えなくてよい","飲み合わせは誰にも確認しない"],1,"お薬手帳などを活用し、医師・薬剤師に服用中の薬やサプリメントを伝えると、重複や相互作用の確認に役立ちます。"],
["看護の視点","薬を使用した後の観察として大切なのは？",["効果や体調変化、副作用の兆候を確認する","薬を使ったら観察は不要","本人の訴えは聞かない","薬の色だけ記録する"],0,"期待する効果だけでなく、体調変化や副作用の兆候も観察し、必要な情報を記録・共有します。"],
["看護の視点","薬の説明を受けた人が「よく分からない」と話したとき、まず大切なのは？",["説明を打ち切る","理解度を確認し、分かりやすい言葉で説明し直す","専門用語を増やす","本人のせいにする"],1,"相手の理解度や不安を確認し、分かりやすい言葉で説明します。必要に応じて薬剤師などと連携します。"],
["博士への最終試験","薬について不明な点があるとき、最も安全な行動は？",["ネットの断片情報だけで決める","家族の薬を試す","医師・薬剤師などに確認する","見た目が似た薬を使う"],2,"薬の適否や使い方は個別の状況で異なります。自己判断せず、医師・薬剤師などに確認することが大切です。"]];
let i=0,score=0,locked=false;const el=id=>document.getElementById(id);function show(id){["start","quiz","result"].forEach(x=>el(x).classList.toggle("hidden",x!==id))}
function draw(){locked=false;let q=qs[i];el("count").textContent=`第${i+1}問 / 10問`;el("points").textContent=`正解 ${score}`;el("fill").style.width=`${i*10}%`;el("level").textContent=q[0];el("question").textContent=q[1];el("feedback").classList.add("hidden");el("next").classList.add("hidden");el("choices").innerHTML="";q[2].forEach((v,n)=>{let b=document.createElement("button");b.className="choice";b.textContent=""+["A","B","C","D"][n]+". "+v;b.onclick=()=>answer(n);el("choices").appendChild(b)})}
function answer(n){if(locked)return;locked=true;let q=qs[i],bs=[...el("choices").children],ok=n===q[3];bs.forEach((b,k)=>{b.disabled=true;if(k===q[3])b.classList.add("correct");if(k===n&&!ok)b.classList.add("wrong")});if(ok){score++;sfx("yes")}else sfx("no");el("points").textContent=`正解 ${score}`;el("feedback").innerHTML=`<strong>${ok?"正解！ ✨":"おしい！"}</strong><br>${q[4]}`;el("feedback").classList.remove("hidden");el("next").textContent=i===9?"結果を見る":"次の問題へ";el("next").classList.remove("hidden")}
function finish(){show("result");el("fill").style.width="100%";let rank,medal,msg;if(score===10){rank="伝説のお薬博士";medal="👑";msg="全問正解！すばらしい冒険だったね！"}else if(score>=8){rank="薬の賢者";medal="🏆";msg="あと一歩で博士級！解説を読み返して知識を磨こう。"}else if(score>=5){rank="薬の研究員";medal="🧪";msg="いい調子！知らなかったことを一つずつ覚えていこう。"}else{rank="薬の見習い";medal="🌱";msg="ここからが冒険の始まり。解説を復習して再挑戦！"}el("rank").textContent=rank;el("medal").textContent=medal;el("score").textContent=`${score} / 10 問正解`;el("message").textContent=msg;sfx("clear")}
function start(){i=0;score=0;show("quiz");draw();startMusic()}el("begin").onclick=start;el("again").onclick=start;el("next").onclick=()=>{if(++i===10)finish();else draw()};
el("share").onclick=()=>{let t=`「お薬博士への道」に挑戦！\n${score}/10問正解・称号：${el("rank").textContent}\nあなたも挑戦してみてね！`;if(navigator.share)navigator.share({title:"お薬博士への道",text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert("結果をコピーしたよ！"))};
let ctx=null,master=null,music=true,timer=null,step=0;function initAudio(){if(ctx)return;let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();master=ctx.createGain();master.gain.value=.13;master.connect(ctx.destination)}
function tone(f,d,v=.05,type="sine",delay=0){if(!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.2);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.04)}
let chords=[[261.6,329.6,392],[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7]];function musicLoop(){if(!music||!ctx)return;let c=chords[step++%4];c.forEach((f,n)=>tone(f,4.8,.018,"sine",n*.08));tone(c[1]*2,2.8,.01,"sine",.65);timer=setTimeout(musicLoop,5000)}
function startMusic(){initAudio();if(ctx&&ctx.state==="suspended")ctx.resume();if(music&&!timer)musicLoop()}
function sfx(k){initAudio();if(ctx&&ctx.state==="suspended")ctx.resume();if(k==="yes"){tone(660,.35,.09);tone(880,.45,.07,"sine",.12)}else if(k==="no"){tone(220,.3,.07,"triangle");tone(196,.35,.05,"triangle",.12)}else[523,659,784,1046].forEach((f,n)=>tone(f,.7,.06,"sine",n*.14))}
el("sound").onclick=()=>{music=!music;el("sound").textContent=music?"♫ 音楽 ON":"♫ 音楽 OFF";if(!music){clearTimeout(timer);timer=null;if(master&&ctx)master.gain.setTargetAtTime(0,ctx.currentTime,.08)}else{if(master&&ctx)master.gain.setTargetAtTime(.13,ctx.currentTime,.2);startMusic()}};
document.addEventListener("visibilitychange",()=>{if(document.hidden){clearTimeout(timer);timer=null}else if(music&&ctx)musicLoop()});
</script></body></html>
